name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the optional PDF extra)
        run: pip install -e ".[test,pdf]"
      - name: Test
        run: pytest -q
      - name: Run the example
        run: doc-ingest examples/corpus --out chunks.jsonl --chunk-size 400

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install without optional extras
        run: pip install -e ".[test]"
      - name: Test (PDF tests skip)
        run: pytest -q
