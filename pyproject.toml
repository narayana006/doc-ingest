[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-ingest"
version = "0.1.0"
description = "Turn text, Markdown, HTML, DOCX and PDF files into section-aware chunks with provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
test = ["pytest>=7"]

[project.scripts]
doc-ingest = "doc_ingest.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/doc-ingest"

[tool.setuptools]
packages = ["doc_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
